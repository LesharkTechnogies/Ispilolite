server:
  base_url_prod: "https://lite.ispilo.co.ke/api/v1"
  base_url_local: "http://localhost:8080/api/v1"
  port: 8080

database:
  postgres_writer:
    host: "${DB_WRITER_HOST}"
    port: 5432
    user: "${DB_WRITER_USER}"
    password: "${DB_WRITER_PASSWORD}"
    dbname: "${DB_NAME}"
  postgres_reader:
    host: "${DB_READER_HOST}"
    port: 5432
    user: "${DB_READER_USER}"
    password: "${DB_READER_PASSWORD}"
    dbname: "${DB_NAME}"
  redis:
    host: "${REDIS_HOST}"
    port: 6379

jwt:
  secret: "your-super-secret-key"
  issuer: "ispilolite"
  expiry_hours: 72
