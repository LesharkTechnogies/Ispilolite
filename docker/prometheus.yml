global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: ispilolite-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]

  - job_name: notification-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
